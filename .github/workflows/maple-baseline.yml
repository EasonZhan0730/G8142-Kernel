          git -C kernel checkout --detach FETCH_HEAD
          mkdir -p toolchain/bin
          for target in aarch64-linux-gnu arm-linux-gnueabi; do
            ln -s "$(command -v "$target-gcc-10")" "toolchain/bin/$target-gcc"
            for tool in ar as ld nm objcopy objdump strip readelf size; do
              ln -s "$(command -v "$target-$tool")" "toolchain/bin/$target-$tool"
            done
            version=$("toolchain/bin/$target-gcc" -dumpversion)
            if [ "${version%%.*}" -lt 5 ]; then
              printf 'Compiler too old: %s\n' "$version" >&2
              exit 1
            fi
          done
          mkdir -p artifacts
          {
            git -C kernel rev-parse HEAD
            toolchain/bin/aarch64-linux-gnu-gcc --version
            toolchain/bin/arm-linux-gnueabi-gcc --version
            aarch64-linux-gnu-ld --version
            arm-linux-gnueabi-ld --version
            dpkg-query -W gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          } > artifacts/versions.txt

      - name: Build baseline kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabi-"
          cd kernel
          make O=out HOSTCFLAGS="-O2 -fcommon" lineage-msm8998-yoshino-maple_dsds_defconfig 2>&1 | tee ../artifacts/configure.log
          cp out/.config ../artifacts/kernel.config
          make O=out HOSTCFLAGS="-O2 -fcommon" -j"$(nproc)" Image.gz-dtb modules 2>&1 | tee ../artifacts/build.log
          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../artifacts/
          cp out/System.map ../artifacts/
          make O=out HOSTCFLAGS="-O2 -fcommon" modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/artifacts/modules" 2>&1 | tee ../artifacts/modules.log
          cd ../artifacts
          sha256sum Image.gz-dtb > SHA256SUMS
          printf '%s\n' 'BASELINE ONLY: no SukiSU, no boot.img, no flashable ZIP. Exact ROM source revision and boot compatibility are not verified.' > READ-ME.txt

      - name: Collect configuration even after a build failure
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config artifacts/kernel.config
          fi

      - name: Upload binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G8142-baseline-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
