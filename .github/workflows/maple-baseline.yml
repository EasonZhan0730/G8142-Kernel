# Put this file at .github/workflows/maple-baseline.yml on your default branch.
# G8142 / LineageOS 21 baseline build. SukiSU is NOT integrated yet.
# Full kernel build verified on Ubuntu 24.04 with GCC 10.5 on 2026-10-07.
# This produces kernel binaries and logs, NOT a flashable boot.img or ZIP.
# Source revision matches the current lineage-21 branch, not proven to be
# the exact source commit used by the user's 2024-06-16 ROM.
name: G8142 baseline kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_REV: 267bc39c46e5ea83ee28749b973bbbf353974139
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex git libssl-dev libelf-dev libncurses-dev python3 rsync kmod gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Fetch kernel and prepare GCC 10
        shell: bash
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin https://github.com/whatawurst/android_kernel_sony_msm8998.git
          git -C kernel fetch --depth=1 origin "$KERNEL_REV"
          git -C kernel checkout --detach FETCH_HEAD
          mkdir -p toolchain/bin
          for target in aarch64-linux-gnu arm-linux-gnueabi; do
            ln -s "$(command -v "$target-gcc-10")" "toolchain/bin/$target-gcc"
            for tool in ar as ld nm objcopy objdump strip readelf size; do
              ln -s "$(command -v "$target-$tool")" "toolchain/bin/$target-$tool"
            done
            version=$("toolchain/bin/$target-gcc" -dumpversion)
            if [ "${version%%.*}" -lt 5 ]; then
              printf 'Compiler too old: %s\n' "$version" >&2
              exit 1
            fi
          done
          mkdir -p artifacts
          {
            git -C kernel rev-parse HEAD
            toolchain/bin/aarch64-linux-gnu-gcc --version
            toolchain/bin/arm-linux-gnueabi-gcc --version
            aarch64-linux-gnu-ld --version
            arm-linux-gnueabi-ld --version
            dpkg-query -W gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          } > artifacts/versions.txt

      - name: Fix Wi-Fi unused-value compatibility with GCC 10
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path("kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_cfg.c")
          old = "#define hdd_cfg_print_action_oui(hdd_ctx) (0)"
          new = "#define hdd_cfg_print_action_oui(hdd_ctx) ((void)0)"
          source = p.read_text()
          if source.count(old) != 1:
              raise SystemExit("Expected Wi-Fi macro not found exactly once; inspect source before patching")
          p.write_text(source.replace(old, new, 1))
          kbuild = Path("kernel/drivers/staging/qcacld-3.0/Kbuild")
          flags = kbuild.read_text()
          if "-Werror" not in flags:
              raise SystemExit("Wi-Fi warning policy changed; inspect Kbuild before patching")
          kbuild.write_text(flags + "\n# Keep unused-value and indentation diagnostics as warnings with GCC 10.\nEXTRA_CFLAGS += -Wno-error=unused-value -Wno-error=misleading-indentation\n")
          softap = Path("kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_softap_tx_rx.c")
          old_rx = '\tif (QDF_STATUS_SUCCESS ==\n\t\thdd_softap_get_sta_id(pAdapter, &src_mac, &staid)) {\n\t\tif (staid < WLAN_MAX_STA_COUNT) {\n\t\t\tpAdapter->aStaInfo[staid].rx_packets++;\n\t\t\tpAdapter->aStaInfo[staid].rx_bytes += skb->len;\n\t\t\tpAdapter->aStaInfo[staid].last_tx_rx_ts =\n\t\t\t\tqdf_system_ticks();\n\t\t}\n\t}\n\n\thdd_dhcp_indication(pAdapter, staid, skb, QDF_RX);'
          new_rx = '\tif (QDF_STATUS_SUCCESS ==\n\t\thdd_softap_get_sta_id(pAdapter, &src_mac, &staid)) {\n\t\tif (staid < WLAN_MAX_STA_COUNT) {\n\t\t\tpAdapter->aStaInfo[staid].rx_packets++;\n\t\t\tpAdapter->aStaInfo[staid].rx_bytes += skb->len;\n\t\t\tpAdapter->aStaInfo[staid].last_tx_rx_ts =\n\t\t\t\tqdf_system_ticks();\n\t\t\thdd_dhcp_indication(pAdapter, staid, skb, QDF_RX);\n\t\t}\n\t}'
          rx_source = softap.read_text()
          if rx_source.count(old_rx) != 1:
              raise SystemExit("Expected SoftAP RX block not found exactly once")
          softap.write_text(rx_source.replace(old_rx, new_rx, 1))
          trace_header = Path("kernel/drivers/staging/qcacld-3.0/core/mac/inc/mac_trace.h")
          trace_source = trace_header.read_text()
          for old_stub, new_stub in [('#define mac_trace_get_neighbour_roam_state(neighbourRoamState) (0)', '#define mac_trace_get_neighbour_roam_state(neighbourRoamState) ((uint8_t *)"disabled")'), ('#define mac_trace_getcsr_roam_state(csr_roamState) (0)', '#define mac_trace_getcsr_roam_state(csr_roamState) ((uint8_t *)"disabled")'), ('#define mac_trace_getcsr_roam_sub_state(csr_roamSubState) (0)', '#define mac_trace_getcsr_roam_sub_state(csr_roamSubState) ((uint8_t *)"disabled")'), ('#define mac_trace_get_lim_sme_state(limState) (0)', '#define mac_trace_get_lim_sme_state(limState) ((uint8_t *)"disabled")'), ('#define mac_trace_get_lim_mlm_state(mlmState) (0)', '#define mac_trace_get_lim_mlm_state(mlmState) ((uint8_t *)"disabled")'), ('#define mac_trace_get_tl_state(tlState) (0)', '#define mac_trace_get_tl_state(tlState) ((uint8_t *)"disabled")')]:
              if trace_source.count(old_stub) != 1:
                  raise SystemExit("Expected MAC trace stub not found exactly once")
              trace_source = trace_source.replace(old_stub, new_stub, 1)
          trace_header.write_text(trace_source)
          cfg_api = Path("kernel/drivers/staging/qcacld-3.0/core/mac/src/cfg/cfg_api.c")
          old_indent = '\t\t\t/* notify other modules if necessary */\n\t\t\tif ((mask & CFG_CTL_NTF_MASK) != 0)\n\t\t\t\tnotify(pMac, cfgId, mask);'
          new_indent = '\t\t/* notify other modules if necessary */\n\t\tif ((mask & CFG_CTL_NTF_MASK) != 0)\n\t\t\tnotify(pMac, cfgId, mask);'
          cfg_source = cfg_api.read_text()
          if cfg_source.count(old_indent) != 1:
              raise SystemExit("Expected cfg_set_int indentation block not found exactly once")
          cfg_api.write_text(cfg_source.replace(old_indent, new_indent, 1))
          cfg_proc = Path("kernel/drivers/staging/qcacld-3.0/core/mac/src/cfg/cfg_proc_msg.c")
          old_loop = '\tfor (i = 0; i < length / 4; i++)\n\t\tpe_debug("[%2d] 0x%08x", i, pParam[i]);'
          new_loop = '\tfor (i = 0; i < length / 4; i++) {\n\t\tpe_debug("[%2d] 0x%08x", i, pParam[i]);\n\t}'
          proc_source = cfg_proc.read_text()
          if proc_source.count(old_loop) != 1:
              raise SystemExit("Expected proc_get_req loop not found exactly once")
          cfg_proc.write_text(proc_source.replace(old_loop, new_loop, 1))
          csr_roam = Path("kernel/drivers/staging/qcacld-3.0/core/sme/src/csr/csr_api_roam.c")
          old_session = '\t\t\t\t\t\t\t   bssId, &sessionId);\n\t\tpSession = CSR_GET_SESSION(pMac, sessionId);'
          new_session = '\t\t\t\t\t\t\t   bssId, &sessionId);\n\t\tif (QDF_IS_STATUS_ERROR(status)) {\n\t\t\tsme_err("association confirmation session lookup failed");\n\t\t\treturn;\n\t\t}\n\t\tpSession = CSR_GET_SESSION(pMac, sessionId);'
          csr_source = csr_roam.read_text()
          if csr_source.count(old_session) != 1:
              raise SystemExit("Expected association confirmation lookup not found exactly once")
          csr_roam.write_text(csr_source.replace(old_session, new_session, 1))
          PYFIX
          git -C kernel diff --check
          git -C kernel diff > artifacts/source-changes.patch

      - name: Build baseline kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabi-"
          cd kernel
          make O=out HOSTCFLAGS="-O2 -fcommon" lineage-msm8998-yoshino-maple_dsds_defconfig 2>&1 | tee ../artifacts/configure.log
          cp out/.config ../artifacts/kernel.config
          make O=out HOSTCFLAGS="-O2 -fcommon" -k -j"$(nproc)" Image.gz-dtb modules 2>&1 | tee ../artifacts/build.log
          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../artifacts/
          cp out/System.map ../artifacts/
          make O=out HOSTCFLAGS="-O2 -fcommon" modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/artifacts/modules" 2>&1 | tee ../artifacts/modules.log
          cd ../artifacts
          sha256sum Image.gz-dtb > SHA256SUMS
          printf '%s\n' 'BASELINE ONLY: no SukiSU, no boot.img, no flashable ZIP. Exact ROM source revision and boot compatibility are not verified.' > READ-ME.txt

      - name: Collect configuration even after a build failure
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config artifacts/kernel.config
          fi

      - name: Upload binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G8142-baseline-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
